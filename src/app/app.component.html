<div class="app-wrapper">
  <div class="card" [class.card--wide]="isWide()">
    <!-- Header -->
    <header class="app-header">
      <div class="app-header__top">
        <div>
          <h1 class="app-title">
            <span class="icon">📋</span>{{ i18n.t('appTitle') }}
          </h1>
          <p class="app-subtitle">
            {{ i18n.t('tasksRemaining', { count: todoService.activeTodos().length }) }}
          </p>
        </div>

        <div class="header-right">
          <!-- Tab switcher (Router Links) -->
          <nav class="main-tabs">
            <a
              class="main-tab"
              routerLink="/tasks"
              routerLinkActive="main-tab--active"
            >
              {{ i18n.t('tabTasks') }}
            </a>
            <a
              class="main-tab"
              routerLink="/kanban"
              routerLinkActive="main-tab--active"
            >
              {{ i18n.t('tabKanban') }}
            </a>
            <a
              class="main-tab"
              routerLink="/calendar"
              routerLinkActive="main-tab--active"
            >
              {{ i18n.t('tabCalendar') }}
            </a>
            <a
              class="main-tab"
              routerLink="/pomodoro"
              routerLinkActive="main-tab--active"
            >
              {{ i18n.t('tabPomodoro') }}
            </a>
          </nav>

          <!-- Settings gear button -->
          <button
            class="gear-btn"
            (click)="openSettings()"
            [title]="i18n.t('settingsTitle')"
            [attr.aria-label]="i18n.t('settingsTitle')"
          >
            ⚙️
          </button>
        </div>
      </div>
    </header>

    <!-- Routed Views -->
    <router-outlet></router-outlet>

  </div>
</div>

<!-- Settings Modal -->
<div class="settings-backdrop" *ngIf="settingsOpen()" (click)="closeSettings()"></div>
<div class="settings-modal" *ngIf="settingsOpen()" role="dialog" [attr.aria-label]="i18n.t('settingsTitle')">
  <div class="settings-modal__header">
    <h2 class="settings-modal__title">⚙️ {{ i18n.t('settingsTitle') }}</h2>
    <button class="settings-modal__close" (click)="closeSettings()" [attr.aria-label]="i18n.t('editCancel')">✕</button>
  </div>
  <div class="settings-modal__body">
    <app-label-manager></app-label-manager>
  </div>
</div>

<!-- Language Switcher — fixed bottom-right, app-wide -->
<div class="lang-switcher">
  <button class="lang-btn" [class.lang-btn--active]="i18n.lang() === 'en'" (click)="setLang('en')">EN</button>
  <button class="lang-btn" [class.lang-btn--active]="i18n.lang() === 'th'" (click)="setLang('th')">ภาษาไทย</button>
  <button class="lang-btn" [class.lang-btn--active]="i18n.lang() === 'zh'" (click)="setLang('zh')">中文</button>
</div>
