<div class="pomodoro-container">
  <!-- Mode Selector Pills -->
  <div class="mode-selector">
    <button
      class="mode-pill"
      [class.mode-pill--active]="currentMode() === 'work'"
      (click)="setMode('work')"
    >
      {{ texts().pomWork }} ({{ pomSettings.workDuration() }}m)
    </button>
    <button
      class="mode-pill"
      [class.mode-pill--active]="currentMode() === 'shortBreak'"
      (click)="setMode('shortBreak')"
    >
      {{ texts().pomShortBreak }} ({{ pomSettings.shortBreakDuration() }}m)
    </button>
    <button
      class="mode-pill"
      [class.mode-pill--active]="currentMode() === 'longBreak'"
      (click)="setMode('longBreak')"
    >
      {{ texts().pomLongBreak }} ({{ pomSettings.longBreakDuration() }}m)
    </button>
  </div>

  <!-- Timer Card Display -->
  <div class="timer-display" [ngClass]="'timer-display--' + currentMode()">
    <!-- Progress bar -->
    <div class="progress-bar">
      <div class="progress-fill" [style.width.%]="progress()"></div>
    </div>

    <span class="timer-mode-label">{{ modeTitle() }}</span>
    <h2 class="timer-digits">{{ formattedTime() }}</h2>

    <!-- Quick duration adjusters (when paused) -->
    <div class="quick-adjust" *ngIf="!isRunning()">
      <button class="adjust-btn" (click)="adjustMinutes(-5)" title="-5m">-5m</button>
      <button class="adjust-btn" (click)="adjustMinutes(-1)" title="-1m">-1m</button>
      <button class="adjust-btn" (click)="adjustMinutes(1)"  title="+1m">+1m</button>
      <button class="adjust-btn" (click)="adjustMinutes(5)"  title="+5m">+5m</button>
    </div>

    <!-- Main controls -->
    <div class="timer-controls">
      <button class="btn-timer btn-timer--primary" (click)="toggleTimer()">
        {{ isRunning() ? texts().pomPause : texts().pomStart }}
      </button>

      <button class="btn-timer btn-timer--secondary" (click)="resetTimer()" [title]="texts().pomReset">
        {{ texts().pomReset }}
      </button>

      <button class="btn-timer btn-timer--ghost" (click)="playNotificationSound()" [title]="texts().pomTestSound">
        {{ texts().pomTestSound }}
      </button>
    </div>
  </div>

  <!-- Stats footer -->
  <div class="pomodoro-stats">
    <div class="stat-item">
      <span class="stat-label">{{ texts().pomCompletedSessions }}</span>
      <span class="stat-val">🍅 {{ completedSessions() }}</span>
    </div>
  </div>
</div>
