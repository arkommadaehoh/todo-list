<div class="app-wrapper">
  <div class="card" [class.card--wide]="isWide()">
    <!-- Header -->
    <header class="app-header">
      <div class="app-header__top">
        <div>
          <h1 class="app-title">
            <span class="icon">📋</span>{{ i18n.t('appTitle') }}
          </h1>
          <p class="app-subtitle">
            {{ i18n.t('tasksRemaining', { count: todoService.activeTodos().length }) }}
          </p>
        </div>

        <!-- Tab switcher (Router Links) -->
        <nav class="main-tabs">
          <a
            class="main-tab"
            routerLink="/tasks"
            routerLinkActive="main-tab--active"
          >
            {{ i18n.t('tabTasks') }}
          </a>
          <a
            class="main-tab"
            routerLink="/kanban"
            routerLinkActive="main-tab--active"
          >
            {{ i18n.t('tabKanban') }}
          </a>
          <a
            class="main-tab"
            routerLink="/calendar"
            routerLinkActive="main-tab--active"
          >
            {{ i18n.t('tabCalendar') }}
          </a>
          <a
            class="main-tab"
            routerLink="/pomodoro"
            routerLinkActive="main-tab--active"
          >
            {{ i18n.t('tabPomodoro') }}
          </a>
        </nav>
      </div>
    </header>

    <!-- Routed Views -->
    <router-outlet></router-outlet>

  </div>
</div>

<!-- Language Switcher — fixed bottom-right, app-wide -->
<div class="lang-switcher">
  <button class="lang-btn" [class.lang-btn--active]="i18n.lang() === 'en'" (click)="setLang('en')">EN</button>
  <button class="lang-btn" [class.lang-btn--active]="i18n.lang() === 'th'" (click)="setLang('th')">ภาษาไทย</button>
  <button class="lang-btn" [class.lang-btn--active]="i18n.lang() === 'zh'" (click)="setLang('zh')">中文</button>
</div>
